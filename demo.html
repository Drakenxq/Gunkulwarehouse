<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Base — Gunkul Warehouse</title>
<style>

  /* ============================================================
     Tokens mirror the app shell: Segoe UI / Noto Sans Thai,
     the same gold accent (#d0a154) and navy gradient, so this
     page reads as part of the same product, not a bolt-on.
     ============================================================ */
  :root{
    --gold:#d0a154;
    --gold-tint:rgba(208,161,84,0.12);
    --gold-tint-strong:rgba(208,161,84,0.22);
    --navy-top:#2b3c63;
    --navy-bottom:#131316;
    --navy-solid:#28305c;

    --bg:#f5f7fb;
    --surface:#ffffff;
    --border:#e6e9f0;
    --border-strong:#d7dbe4;

    --text:#20242e;
    --text-secondary:#5b6472;
    --text-tertiary:#98a1ad;

    --radius-lg:16px;
    --radius-md:10px;
    --radius-sm:7px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Segoe UI","Noto Sans Thai",-apple-system,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{margin:0;}
  p{margin:0;}
  button{font-family:inherit;}

  /* ---- shared motion, named to match the shell's own keyframes ---- */
  @keyframes fadeSlideDown{
    from{ opacity:0; transform:translateY(-10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes itemRiseIn{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes contentFadeIn{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes modalIn{
    from{ opacity:0; transform:translateY(10px) scale(.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }

  /* on-scroll reveal: cards start lowered + faded, JS adds .in-view
     as each one enters the viewport while scrolling down */
  .reveal-on-scroll{
    opacity:0;
    transform:translateY(28px);
    transition:opacity .55s cubic-bezier(.22,1,.36,1), transform .55s cubic-bezier(.22,1,.36,1);
  }
  .reveal-on-scroll.in-view{
    opacity:1;
    transform:translateY(0);
  }

  /* ---- layout ---- */
  .kb-page{ max-width:1180px; margin:0 auto; padding:0 clamp(16px,4vw,40px) 64px; }

  /* ---- hero ---- */
  .kb-hero{
    margin:0 clamp(-16px,-4vw,0px) 28px;
    padding:clamp(28px,4vw,44px) clamp(16px,4vw,40px);
    background:linear-gradient(135deg,var(--navy-top) 0%,var(--navy-bottom) 100%);
    color:#f4f4f6;
    display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap;
    opacity:0;
    animation:fadeSlideDown .6s ease .05s forwards;
  }
  .kb-hero__text h1{ font-size:23px; font-weight:700; letter-spacing:.2px; }
  .kb-hero__text p{ font-size:13.5px; color:#a9adba; margin-top:6px; max-width:480px; }

  .btn-gold{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--gold); color:#241a0c;
    border:none; border-radius:var(--radius-md);
    padding:11px 18px; font-size:13.5px; font-weight:600;
    cursor:pointer; white-space:nowrap;
    transition:background .18s ease, transform .15s ease, box-shadow .18s ease;
    box-shadow:0 6px 16px -6px rgba(208,161,84,.55);
  }
  .btn-gold:hover{ background:#dbb06a; transform:translateY(-1px); }
  .btn-gold:active{ transform:translateY(0) scale(.98); }
  .btn-gold svg{ width:16px; height:16px; stroke:currentColor; flex-shrink:0; }

  /* ---- toolbar ---- */
  .kb-toolbar{
    display:flex; flex-wrap:wrap; align-items:center; gap:12px;
    margin-bottom:26px;
    opacity:0;
    animation:fadeSlideDown .55s ease .15s forwards;
  }
  .kb-search{
    flex:1 1 240px; position:relative;
  }
  .kb-search input{
    width:100%; padding:11px 14px 11px 38px;
    border:1px solid var(--border-strong); border-radius:var(--radius-md);
    background:var(--surface); color:var(--text); font-size:13.5px;
    outline:none; transition:border-color .15s ease, box-shadow .15s ease;
  }
  .kb-search input:focus{ border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-tint); }
  .kb-search svg{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    width:15px; height:15px; stroke:var(--text-tertiary); pointer-events:none;
  }

  .kb-chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .kb-chip{
    padding:8px 14px; border-radius:999px; border:1px solid var(--border-strong);
    background:var(--surface); color:var(--text-secondary); font-size:12.5px; font-weight:500;
    cursor:pointer; white-space:nowrap; transition:all .15s ease;
  }
  .kb-chip:hover{ border-color:var(--gold); color:var(--text); }
  .kb-chip.is-active{ background:var(--navy-solid); border-color:var(--navy-solid); color:#fff; }

  /* ---- grid ---- */
  .kb-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:18px;
  }

  .kb-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:20px; display:flex; flex-direction:column; gap:12px;
    cursor:pointer;
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .kb-card:hover{
    transform:translateY(-3px);
    box-shadow:0 16px 30px -18px rgba(20,25,40,.25);
    border-color:var(--border-strong);
  }
  .kb-card__top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .kb-tag{
    display:inline-flex; align-items:center; font-size:11px; font-weight:600;
    padding:4px 10px; border-radius:999px; background:var(--gold-tint); color:#96702c;
    white-space:nowrap;
  }
  .kb-card__date{ font-size:11.5px; color:var(--text-tertiary); white-space:nowrap; }
  .kb-card__title{ font-size:16px; font-weight:700; color:var(--text); line-height:1.35; }
  .kb-card__excerpt{
    font-size:13px; color:var(--text-secondary); line-height:1.6;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .kb-card__foot{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding-top:10px; margin-top:auto; border-top:1px solid var(--border);
  }
  .kb-card__author{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--text-tertiary); }
  .kb-avatar{
    width:20px; height:20px; border-radius:50%; background:var(--navy-solid); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; flex-shrink:0;
  }
  .kb-card__tags{ display:flex; gap:6px; flex-wrap:wrap; }
  .kb-minitag{ font-size:10.5px; color:var(--text-tertiary); background:var(--bg); border:1px solid var(--border); padding:2px 8px; border-radius:999px; }

  /* ---- empty / loading ---- */
  .kb-state{
    grid-column:1 / -1; text-align:center; padding:60px 20px; color:var(--text-tertiary);
  }
  .kb-state svg{ width:38px; height:38px; stroke:var(--text-tertiary); margin-bottom:14px; }
  .kb-state p{ font-size:13.5px; }
  .kb-state .btn-gold{ margin-top:18px; }

  .kb-spinner{
    width:26px; height:26px; border:3px solid var(--border);
    border-top-color:var(--gold); border-radius:50%;
    animation:spin .8s linear infinite; margin:0 auto 14px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---- modal (detail + form share the same shell) ---- */
  .kb-overlay{
    position:fixed; inset:0; z-index:50; display:none;
    align-items:center; justify-content:center; padding:20px;
  }
  .kb-overlay.is-open{ display:flex; }
  .kb-overlay__backdrop{ position:absolute; inset:0; background:rgba(19,19,22,.55); backdrop-filter:blur(4px); }
  .kb-panel{
    position:relative; z-index:1; width:100%; max-width:620px; max-height:86vh; overflow-y:auto;
    background:var(--surface); border-radius:var(--radius-lg); padding:30px;
    animation:modalIn .25s cubic-bezier(.22,1,.36,1);
  }
  .kb-panel__close{
    position:absolute; top:20px; right:20px; width:32px; height:32px; border-radius:50%;
    border:1px solid var(--border-strong); background:transparent; color:var(--text-tertiary);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:color .15s ease, border-color .15s ease;
  }
  .kb-panel__close:hover{ color:var(--text); border-color:var(--gold); }
  .kb-panel__close svg{ width:14px; height:14px; stroke:currentColor; }

  .kb-panel__tag{ margin-bottom:14px; }
  .kb-panel__title{ font-size:20px; font-weight:700; margin-bottom:8px; padding-right:30px; }
  .kb-panel__meta{ font-size:12.5px; color:var(--text-tertiary); margin-bottom:22px; padding-bottom:18px; border-bottom:1px solid var(--border); }
  .kb-panel__body{ font-size:14px; color:var(--text); white-space:pre-wrap; line-height:1.75; }
  .kb-panel__tags{ display:flex; gap:8px; flex-wrap:wrap; margin-top:22px; }

  /* ---- form ---- */
  .kb-field{ margin-bottom:16px; }
  .kb-field label{ display:block; font-size:12.5px; font-weight:600; color:var(--text-secondary); margin-bottom:7px; }
  .kb-field input, .kb-field select, .kb-field textarea{
    width:100%; border:1px solid var(--border-strong); border-radius:var(--radius-md);
    padding:10px 13px; font-size:13.5px; font-family:inherit; color:var(--text);
    outline:none; transition:border-color .15s ease, box-shadow .15s ease; background:var(--surface);
  }
  .kb-field input:focus, .kb-field select:focus, .kb-field textarea:focus{
    border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-tint);
  }
  .kb-field textarea{ min-height:160px; resize:vertical; line-height:1.6; }
  .kb-field--hint{ font-size:11.5px; color:var(--text-tertiary); margin-top:6px; }
  .kb-field-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:520px){ .kb-field-row{ grid-template-columns:1fr; } }

  .kb-form-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:22px; }
  .btn-plain{
    padding:10px 18px; border-radius:var(--radius-md); border:1px solid var(--border-strong);
    background:transparent; color:var(--text-secondary); font-size:13px; font-weight:500; cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .btn-plain:hover{ border-color:var(--text-tertiary); color:var(--text); }
  .btn-gold[disabled]{ opacity:.55; cursor:default; transform:none; box-shadow:none; }

  .kb-error{
    font-size:12.5px; color:#b3452f; background:rgba(179,69,47,.08); border:1px solid rgba(179,69,47,.25);
    border-radius:var(--radius-sm); padding:10px 12px; margin-bottom:16px; display:none;
  }
  .kb-error.is-visible{ display:block; }

  @media (max-width:640px){
    .kb-hero{ flex-direction:column; align-items:flex-start; }
  }

</style>
</head>
<body>

<div class="kb-page">

  <section class="kb-hero">
    <div class="kb-hero__text">
      <h1>Knowledge Base</h1>
      <p>รวมขั้นตอนการทำงาน คู่มือ และข้อมูลอ้างอิงของทีมคลังสินค้าไว้ที่เดียว</p>
    </div>
    <button class="btn-gold" id="btnNewEntry" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      เพิ่มบทความใหม่
    </button>
  </section>

  <div class="kb-toolbar">
    <div class="kb-search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="kbSearch" type="text" placeholder="ค้นหาบทความ, คำสำคัญ, แท็ก…">
    </div>
    <div class="kb-chips" id="kbChips">
      <button class="kb-chip is-active" data-category="">ทั้งหมด</button>
    </div>
  </div>

  <div class="kb-grid" id="kbGrid">
    <div class="kb-state" id="kbLoadingState">
      <div class="kb-spinner"></div>
      <p>กำลังโหลดบทความ…</p>
    </div>
  </div>

</div>

<!-- ===== Detail modal ===== -->
<div class="kb-overlay" id="kbDetailOverlay">
  <div class="kb-overlay__backdrop" data-close></div>
  <div class="kb-panel">
    <button class="kb-panel__close" data-close aria-label="ปิด">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div class="kb-panel__tag"><span class="kb-tag" id="detailCategory">–</span></div>
    <h2 class="kb-panel__title" id="detailTitle">–</h2>
    <p class="kb-panel__meta" id="detailMeta">–</p>
    <div class="kb-panel__body" id="detailBody">–</div>
    <div class="kb-panel__tags" id="detailTags"></div>
  </div>
</div>

<!-- ===== New entry form modal ===== -->
<div class="kb-overlay" id="kbFormOverlay">
  <div class="kb-overlay__backdrop" data-close></div>
  <div class="kb-panel">
    <button class="kb-panel__close" data-close aria-label="ปิด">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <h2 class="kb-panel__title" style="margin-bottom:20px;">เพิ่มบทความใหม่</h2>

    <div class="kb-error" id="formError"></div>

    <form id="kbForm">
      <div class="kb-field-row">
        <div class="kb-field">
          <label for="fTitle">หัวข้อ</label>
          <input id="fTitle" type="text" placeholder="เช่น ขั้นตอนการรับสินค้าเข้าคลัง" required>
        </div>
        <div class="kb-field">
          <label for="fCategory">หมวดหมู่</label>
          <input id="fCategory" type="text" list="categoryList" placeholder="เช่น การรับสินค้า" required>
          <datalist id="categoryList"></datalist>
        </div>
      </div>

      <div class="kb-field">
        <label for="fContent">เนื้อหา</label>
        <textarea id="fContent" placeholder="อธิบายรายละเอียด ขั้นตอน หรือข้อมูลอ้างอิง…" required></textarea>
        <div class="kb-field--hint">ขึ้นบรรทัดใหม่ได้ตามปกติ ระบบจะจัดรูปแบบให้อัตโนมัติ</div>
      </div>

      <div class="kb-field">
        <label for="fTags">แท็ก</label>
        <input id="fTags" type="text" placeholder="คั่นด้วยจุลภาค เช่น รับเข้า, คลัง A, ด่วน">
      </div>

      <div class="kb-form-actions">
        <button type="button" class="btn-plain" data-close>ยกเลิก</button>
        <button type="submit" class="btn-gold" id="fSubmit">บันทึกบทความ</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
  import { auth } from "./src/js/firebase.js";
  import { onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, collection, addDoc, doc, getDoc, onSnapshot, query, orderBy, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const db = getFirestore(auth.app);
  const COLLECTION = "knowledge_base";

  let RAW = [];
  let activeCategory = "";
  let searchTerm = "";
  let currentUser = { name: "ผู้ใช้งาน", uid: null };

  const grid = document.getElementById("kbGrid");
  const chipsWrap = document.getElementById("kbChips");
  const searchInput = document.getElementById("kbSearch");

  function escapeHtml(s){
    return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }
  function initials(name){
    const parts = String(name || "?").trim().split(/\s+/);
    return ((parts[0]?.[0] || "") + (parts[1]?.[0] || "")).toUpperCase() || "?";
  }
  function fmtDateThai(d){
    if(!d) return "–";
    return d.toLocaleDateString("th-TH", { day:"2-digit", month:"short", year:"numeric" });
  }
  function toDateSafe(v){
    if(!v) return null;
    if(v.toDate) return v.toDate();
    if(v.seconds) return new Date(v.seconds * 1000);
    return null;
  }

  // ---- auth: identify the current person for the "author" field ----
  onAuthStateChanged(auth, async (user) => {
    if(!user) return;
    let name = user.displayName || (user.email ? user.email.split("@")[0] : "ผู้ใช้งาน");
    try {
      const snap = await getDoc(doc(db, "users", user.uid));
      if(snap.exists() && snap.data().name) name = snap.data().name;
    } catch(err){ /* fall back silently to the display name above */ }
    currentUser = { name, uid: user.uid };
  });

  // ---- live data from Firestore, newest first ----
  onSnapshot(query(collection(db, COLLECTION), orderBy("createdAt", "desc")), (snap) => {
    RAW = snap.docs.map(d => {
      const data = d.data();
      return {
        id: d.id,
        title: data.title || "ไม่มีชื่อเรื่อง",
        category: data.category || "ทั่วไป",
        content: data.content || "",
        tags: Array.isArray(data.tags) ? data.tags : [],
        author: data.author || "ไม่ระบุ",
        createdAt: toDateSafe(data.createdAt)
      };
    });
    populateCategoryChips();
    populateCategoryDatalist();
    renderGrid();
  }, (err) => {
    console.error(err);
    grid.innerHTML = `
      <div class="kb-state">
        <p>โหลดบทความไม่สำเร็จ (${escapeHtml(err.code || err.message)})</p>
      </div>`;
  });

  function populateCategoryChips(){
    const cats = [...new Set(RAW.map(r => r.category).filter(Boolean))].sort();
    chipsWrap.innerHTML = `<button class="kb-chip ${activeCategory === "" ? "is-active" : ""}" data-category="">ทั้งหมด</button>` +
      cats.map(c => `<button class="kb-chip ${activeCategory === c ? "is-active" : ""}" data-category="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join("");

    chipsWrap.querySelectorAll(".kb-chip").forEach(btn => {
      btn.addEventListener("click", () => {
        activeCategory = btn.dataset.category;
        chipsWrap.querySelectorAll(".kb-chip").forEach(b => b.classList.toggle("is-active", b === btn));
        renderGrid();
      });
    });
  }

  function populateCategoryDatalist(){
    const cats = [...new Set(RAW.map(r => r.category).filter(Boolean))].sort();
    document.getElementById("categoryList").innerHTML = cats.map(c => `<option value="${escapeHtml(c)}">`).join("");
  }

  searchInput.addEventListener("input", () => {
    searchTerm = searchInput.value.trim().toLowerCase();
    renderGrid();
  });

  function filteredEntries(){
    return RAW.filter(r => {
      if(activeCategory && r.category !== activeCategory) return false;
      if(searchTerm){
        const hay = [r.title, r.content, r.category, ...r.tags].join(" ").toLowerCase();
        if(!hay.includes(searchTerm)) return false;
      }
      return true;
    });
  }

  function renderGrid(){
    const items = filteredEntries();

    if(!items.length){
      grid.innerHTML = `
        <div class="kb-state">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H12v18H6.5A2.5 2.5 0 0 1 4 18.5v-13Z"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H12v18h5.5a2.5 2.5 0 0 0 2.5-2.5v-13Z"/></svg>
          <p>${RAW.length ? "ไม่พบบทความที่ตรงกับเงื่อนไขการค้นหา" : "ยังไม่มีบทความในระบบ เริ่มเพิ่มบทความแรกได้เลย"}</p>
          <button class="btn-gold" id="emptyAddBtn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            เพิ่มบทความใหม่
          </button>
        </div>`;
      document.getElementById("emptyAddBtn")?.addEventListener("click", openFormModal);
      return;
    }

    grid.innerHTML = items.map(r => `
      <article class="kb-card reveal-on-scroll" data-id="${escapeHtml(r.id)}">
        <div class="kb-card__top">
          <span class="kb-tag">${escapeHtml(r.category)}</span>
          <span class="kb-card__date">${fmtDateThai(r.createdAt)}</span>
        </div>
        <h3 class="kb-card__title">${escapeHtml(r.title)}</h3>
        <p class="kb-card__excerpt">${escapeHtml(r.content)}</p>
        <div class="kb-card__foot">
          <div class="kb-card__author">
            <span class="kb-avatar">${escapeHtml(initials(r.author))}</span>
            ${escapeHtml(r.author)}
          </div>
          <div class="kb-card__tags">
            ${r.tags.slice(0,2).map(t => `<span class="kb-minitag">${escapeHtml(t)}</span>`).join("")}
          </div>
        </div>
      </article>
    `).join("");

    grid.querySelectorAll(".kb-card").forEach(card => {
      card.addEventListener("click", () => openDetail(card.dataset.id));
    });

    observeReveal();
  }

  // ---- reveal-on-scroll: cards fade + rise into place as the user
  // scrolls down to them, rather than all animating on load at once ----
  let revealObserver = null;
  function observeReveal(){
    if(revealObserver) revealObserver.disconnect();
    revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry, i) => {
        if(entry.isIntersecting){
          setTimeout(() => entry.target.classList.add("in-view"), i * 40);
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
    document.querySelectorAll(".reveal-on-scroll:not(.in-view)").forEach(el => revealObserver.observe(el));
  }

  // ---- detail modal ----
  const detailOverlay = document.getElementById("kbDetailOverlay");
  function openDetail(id){
    const r = RAW.find(x => x.id === id);
    if(!r) return;
    document.getElementById("detailCategory").textContent = r.category;
    document.getElementById("detailTitle").textContent = r.title;
    document.getElementById("detailMeta").textContent = `เขียนโดย ${r.author} · ${fmtDateThai(r.createdAt)}`;
    document.getElementById("detailBody").textContent = r.content;
    document.getElementById("detailTags").innerHTML = r.tags.map(t => `<span class="kb-minitag">${escapeHtml(t)}</span>`).join("");
    detailOverlay.classList.add("is-open");
  }

  // ---- add-entry form modal ----
  const formOverlay = document.getElementById("kbFormOverlay");
  const kbForm = document.getElementById("kbForm");
  const formError = document.getElementById("formError");
  const submitBtn = document.getElementById("fSubmit");

  function openFormModal(){
    formError.classList.remove("is-visible");
    kbForm.reset();
    formOverlay.classList.add("is-open");
    document.getElementById("fTitle").focus();
  }
  document.getElementById("btnNewEntry").addEventListener("click", openFormModal);

  kbForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    formError.classList.remove("is-visible");

    const title = document.getElementById("fTitle").value.trim();
    const category = document.getElementById("fCategory").value.trim();
    const content = document.getElementById("fContent").value.trim();
    const tags = document.getElementById("fTags").value
      .split(",").map(t => t.trim()).filter(Boolean);

    if(!title || !category || !content){
      formError.textContent = "กรุณากรอกหัวข้อ หมวดหมู่ และเนื้อหาให้ครบถ้วน";
      formError.classList.add("is-visible");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "กำลังบันทึก…";

    try {
      await addDoc(collection(db, COLLECTION), {
        title, category, content, tags,
        author: currentUser.name,
        authorUid: currentUser.uid,
        createdAt: serverTimestamp()
      });
      formOverlay.classList.remove("is-open");
    } catch(err){
      console.error(err);
      formError.textContent = `บันทึกไม่สำเร็จ (${err.code || err.message})`;
      formError.classList.add("is-visible");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "บันทึกบทความ";
    }
  });

  // ---- shared overlay close behaviour ----
  document.querySelectorAll("[data-close]").forEach(el => {
    el.addEventListener("click", () => {
      detailOverlay.classList.remove("is-open");
      formOverlay.classList.remove("is-open");
    });
  });
  document.addEventListener("keydown", (e) => {
    if(e.key === "Escape"){
      detailOverlay.classList.remove("is-open");
      formOverlay.classList.remove("is-open");
    }
  });
</script>

</body>
</html>
