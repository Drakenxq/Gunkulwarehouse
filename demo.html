<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Base — Gunkul Warehouse</title>
<style>
  /* ============================================================
     Same token names and feel as the shell: navy→charcoal gradient,
     gold accent, Segoe UI / Noto Sans Thai stack. This page lives on
     a light content background (matches #content in the shell), so
     the navy/gold pairing shows up as accents rather than the whole
     surface.
     ============================================================ */
  :root{
    --gold:#d0a154;
    --gold-tint:rgba(208,161,84,0.12);
    --navy-solid:#28305c;
    --navy-tint:rgba(40,48,92,0.06);

    --bg:#f5f7fb;
    --card:#ffffff;
    --border:#e6e9f1;
    --border-strong:#d7dbe6;

    --text-primary:#20242f;
    --text-secondary:#6c7180;
    --text-tertiary:#9aa0ad;

    --danger:#d0554f;
    --danger-tint:rgba(208,85,79,0.1);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Segoe UI","Noto Sans Thai",-apple-system,sans-serif;
    background:var(--bg);
    color:var(--text-primary);
    line-height:1.55;
  }
  h1,h2,h3{margin:0;}
  p{margin:0;}
  button{font-family:inherit;}

  @keyframes fadeSlideDown{
    from{ opacity:0; transform:translateY(-8px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes revealOnScroll{
    from{ opacity:0; transform:translateY(22px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes popIn{
    from{ opacity:0; transform:scale(.96) translateY(6px); }
    to{ opacity:1; transform:scale(1) translateY(0); }
  }
  @keyframes justAddedPulse{
    0%{ box-shadow:0 0 0 0 rgba(208,161,84,.45); }
    70%{ box-shadow:0 0 0 12px rgba(208,161,84,0); }
    100%{ box-shadow:0 0 0 0 rgba(208,161,84,0); }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }

  /* ---------------- page shell ---------------- */
  .kb-page{
    max-width:1180px;
    margin:0 auto;
    padding:32px clamp(18px,4vw,40px) 64px;
  }

  .kb-header{
    display:flex; align-items:flex-start; justify-content:space-between; gap:20px;
    padding-bottom:22px; margin-bottom:22px;
    border-bottom:1px solid var(--border);
    opacity:0; animation:fadeSlideDown .5s ease .02s forwards;
  }
  .kb-header h1{ font-size:22px; font-weight:700; letter-spacing:-.01em; }
  .kb-header p{ font-size:13.5px; color:var(--text-secondary); margin-top:6px; max-width:52ch; }

  .btn-gold{
    display:inline-flex; align-items:center; gap:8px; flex-shrink:0;
    background:var(--navy-solid); color:#fff; border:1px solid var(--navy-solid);
    font-size:13.5px; font-weight:600; letter-spacing:.1px;
    padding:11px 18px; border-radius:9px; cursor:pointer;
    transition: background .18s ease, transform .12s ease, box-shadow .18s ease;
  }
  .btn-gold:hover{ background:#333e6f; box-shadow:0 6px 16px rgba(40,48,92,0.22); }
  .btn-gold:active{ transform:scale(.97); }
  .btn-gold svg{ width:15px; height:15px; stroke:currentColor; flex-shrink:0; }

  .btn-ghost{
    background:transparent; border:1px solid var(--border-strong); color:var(--text-secondary);
    font-size:13.5px; font-weight:500; padding:10px 16px; border-radius:9px; cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .btn-ghost:hover{ border-color:var(--navy-solid); color:var(--navy-solid); }

  /* ---------------- toolbar ---------------- */
  .kb-toolbar{
    display:flex; flex-wrap:wrap; align-items:center; gap:14px;
    margin-bottom:26px;
    opacity:0; animation:fadeSlideDown .5s ease .08s forwards;
  }
  .kb-search{
    display:flex; align-items:center; gap:9px;
    background:var(--card); border:1px solid var(--border);
    border-radius:10px; padding:10px 14px; min-width:240px; flex:1 1 240px;
    transition:border-color .15s ease;
  }
  .kb-search:focus-within{ border-color:var(--gold); }
  .kb-search svg{ width:16px; height:16px; stroke:var(--text-tertiary); flex-shrink:0; }
  .kb-search input{
    border:none; outline:none; background:transparent; font-size:13.5px; color:var(--text-primary);
    width:100%; font-family:inherit;
  }
  .kb-search input::placeholder{ color:var(--text-tertiary); }

  .kb-chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .kb-chip{
    font-size:12.5px; font-weight:500; color:var(--text-secondary);
    background:var(--card); border:1px solid var(--border);
    padding:7px 14px; border-radius:20px; cursor:pointer; white-space:nowrap;
    transition:all .15s ease;
  }
  .kb-chip:hover{ border-color:var(--gold); color:var(--text-primary); }
  .kb-chip.is-active{ background:var(--navy-solid); border-color:var(--navy-solid); color:#fff; }

  /* ---------------- grid & cards ---------------- */
  .kb-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
    gap:18px;
  }

  .kb-card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:20px; display:flex; flex-direction:column; gap:12px; cursor:pointer;
    opacity:0; transform:translateY(22px);
    transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
  }
  .kb-card.is-visible{ animation:revealOnScroll .55s cubic-bezier(.22,.61,.36,1) forwards; }
  .kb-card.just-added{ animation:popIn .4s cubic-bezier(.22,.61,.36,1) forwards, justAddedPulse 1.4s ease .3s; }
  .kb-card:hover{ border-color:var(--gold); box-shadow:0 10px 26px rgba(32,36,47,0.07); transform:translateY(-2px); }

  .kb-card__top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .kb-tag{
    font-size:11px; font-weight:600; letter-spacing:.1px;
    padding:4px 10px; border-radius:20px; white-space:nowrap;
  }
  .kb-card__delete{
    background:transparent; border:none; color:var(--text-tertiary); cursor:pointer;
    width:24px; height:24px; border-radius:6px; display:flex; align-items:center; justify-content:center;
    opacity:0; transition:opacity .15s ease, background .15s ease, color .15s ease; flex-shrink:0;
  }
  .kb-card:hover .kb-card__delete{ opacity:1; }
  .kb-card__delete:hover{ background:var(--danger-tint); color:var(--danger); }
  .kb-card__delete svg{ width:14px; height:14px; stroke:currentColor; }

  .kb-card h3{ font-size:15.5px; font-weight:600; line-height:1.4; }
  .kb-card__excerpt{
    font-size:13px; color:var(--text-secondary); line-height:1.6;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .kb-card__meta{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    font-size:11.5px; color:var(--text-tertiary); margin-top:auto; padding-top:8px;
    border-top:1px solid var(--border);
  }

  .kb-empty{
    text-align:center; padding:70px 20px; color:var(--text-secondary);
    display:flex; flex-direction:column; align-items:center; gap:14px;
  }
  .kb-empty svg{ width:40px; height:40px; stroke:var(--text-tertiary); }
  .kb-empty p{ font-size:14px; max-width:40ch; }

  /* ---------------- modals ---------------- */
  .kb-modal{ position:fixed; inset:0; z-index:50; display:none; }
  .kb-modal.is-open{ display:flex; align-items:center; justify-content:center; padding:20px; }
  .kb-modal__backdrop{ position:absolute; inset:0; background:rgba(20,22,30,0.55); backdrop-filter:blur(3px); }
  .kb-modal__panel{
    position:relative; z-index:1; width:100%; max-width:560px; max-height:88vh; overflow-y:auto;
    background:var(--card); border-radius:16px; padding:28px;
    animation:popIn .22s cubic-bezier(.22,.61,.36,1);
  }
  .kb-modal__panel--view{ max-width:640px; }
  .kb-modal__close{
    position:absolute; top:18px; right:18px; width:30px; height:30px; border-radius:50%;
    border:1px solid var(--border); background:transparent; color:var(--text-tertiary); cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:13px;
    transition:border-color .15s ease, color .15s ease;
  }
  .kb-modal__close:hover{ border-color:var(--gold); color:var(--text-primary); }

  .kb-modal__panel h2{ font-size:17px; font-weight:700; margin-bottom:20px; padding-right:30px; }

  .kb-field{ margin-bottom:16px; }
  .kb-field label{ display:block; font-size:12.5px; font-weight:600; color:var(--text-secondary); margin-bottom:6px; }
  .kb-field input, .kb-field textarea{
    width:100%; border:1px solid var(--border); border-radius:9px; padding:10px 13px;
    font-family:inherit; font-size:13.5px; color:var(--text-primary); outline:none; resize:vertical;
    transition:border-color .15s ease;
  }
  .kb-field input:focus, .kb-field textarea:focus{ border-color:var(--gold); }
  .kb-field__error{ font-size:12px; color:var(--danger); margin-top:5px; display:none; }
  .kb-field.has-error input, .kb-field.has-error textarea{ border-color:var(--danger); }
  .kb-field.has-error .kb-field__error{ display:block; }

  .kb-modal__actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:22px; }

  .kb-view__tag{ display:inline-block; margin-bottom:14px; }
  .kb-view__meta{ font-size:12px; color:var(--text-tertiary); margin-bottom:18px; }
  .kb-view__body{ font-size:14px; color:var(--text-primary); white-space:pre-wrap; line-height:1.75; }

  @media (max-width:600px){
    .kb-header{ flex-direction:column; }
    .kb-grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div class="kb-page">
  <header class="kb-header">
    <div>
      <h1>คลังความรู้</h1>
      <p>รวมขั้นตอนการทำงาน ข้อมูลอ้างอิง และบันทึกของทีมคลังสินค้า — เพิ่มบทความใหม่ได้ทุกเมื่อ</p>
    </div>
    <button class="btn-gold" id="btnAdd" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      เพิ่มบทความใหม่
    </button>
  </header>

  <div class="kb-toolbar">
    <div class="kb-search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="kbSearch" type="text" placeholder="ค้นหาหัวข้อหรือเนื้อหา…">
    </div>
    <div class="kb-chips" id="kbChips"></div>
  </div>

  <div class="kb-grid" id="kbGrid"></div>

  <div class="kb-empty" id="kbEmpty" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H12v18H6.5A2.5 2.5 0 0 1 4 18.5v-13Z"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H12v18h5.5a2.5 2.5 0 0 0 2.5-2.5v-13Z"/></svg>
    <p id="kbEmptyText">ยังไม่มีบทความในคลังความรู้ — เริ่มเพิ่มบทความแรกของทีมได้เลย</p>
    <button class="btn-gold" id="btnAddEmpty" type="button">เพิ่มบทความใหม่</button>
  </div>
</div>

<!-- Add article modal -->
<div class="kb-modal" id="kbAddModal">
  <div class="kb-modal__backdrop" data-close></div>
  <div class="kb-modal__panel">
    <button class="kb-modal__close" data-close type="button">✕</button>
    <h2>เพิ่มบทความใหม่</h2>

    <div class="kb-field" id="fieldTitle">
      <label for="fTitle">หัวข้อ</label>
      <input id="fTitle" type="text" placeholder="เช่น ขั้นตอนการรับสินค้าเข้าคลัง">
      <span class="kb-field__error">กรุณากรอกหัวข้อ</span>
    </div>

    <div class="kb-field" id="fieldCategory">
      <label for="fCategory">หมวดหมู่</label>
      <input id="fCategory" list="kbCategoryList" type="text" placeholder="เช่น คลังสินค้า, ระบบ IT, นโยบายบริษัท">
      <datalist id="kbCategoryList"></datalist>
      <span class="kb-field__error">กรุณาระบุหมวดหมู่</span>
    </div>

    <div class="kb-field" id="fieldContent">
      <label for="fContent">เนื้อหา</label>
      <textarea id="fContent" rows="7" placeholder="อธิบายรายละเอียด ขั้นตอน หรือหมายเหตุ…"></textarea>
      <span class="kb-field__error">กรุณากรอกเนื้อหา</span>
    </div>

    <div class="kb-modal__actions">
      <button class="btn-ghost" type="button" data-close>ยกเลิก</button>
      <button class="btn-gold" id="fSave" type="button">บันทึกบทความ</button>
    </div>
  </div>
</div>

<!-- View article modal -->
<div class="kb-modal" id="kbViewModal">
  <div class="kb-modal__backdrop" data-close></div>
  <div class="kb-modal__panel kb-modal__panel--view">
    <button class="kb-modal__close" data-close type="button">✕</button>
    <span class="kb-tag kb-view__tag" id="viewTag">หมวดหมู่</span>
    <h2 id="viewTitle" style="margin-bottom:6px;">หัวข้อบทความ</h2>
    <p class="kb-view__meta" id="viewMeta">–</p>
    <div class="kb-view__body" id="viewBody">–</div>
  </div>
</div>

<script type="module">
  import { auth } from "./src/js/firebase.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import {
    getFirestore, collection, getDocs, addDoc, deleteDoc, doc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const db = getFirestore(auth.app);
  const COLLECTION = "knowledge_base";

  let ARTICLES = [];
  let currentUserLabel = "ผู้ใช้งาน";
  let activeCategory = "";
  let searchTerm = "";

  const TAG_PALETTE = [
    { bg:"rgba(208,161,84,0.14)", fg:"#8a6528" },
    { bg:"rgba(40,48,92,0.10)",  fg:"#28305c" },
    { bg:"rgba(59,146,120,0.12)", fg:"#28714f" },
    { bg:"rgba(80,130,200,0.12)", fg:"#2a5f9e" },
    { bg:"rgba(190,90,140,0.12)", fg:"#9e3f6f" },
    { bg:"rgba(200,120,60,0.12)", fg:"#985a24" }
  ];
  function tagColor(category){
    let hash = 0;
    for(const ch of category) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
    return TAG_PALETTE[hash % TAG_PALETTE.length];
  }

  function escapeHtml(s){
    return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }
  function toDateSafe(v){
    if(!v) return null;
    if(v.toDate) return v.toDate();
    if(v.seconds) return new Date(v.seconds * 1000);
    return null;
  }
  function fmtDateThai(d){
    if(!d) return "เพิ่งเพิ่ม";
    return d.toLocaleDateString("th-TH", { day:"2-digit", month:"short", year:"numeric" });
  }

  onAuthStateChanged(auth, (user) => {
    if(user){
      currentUserLabel = user.displayName || (user.email ? user.email.split("@")[0] : "ผู้ใช้งาน");
    }
  });

  async function loadArticles(){
    try{
      const snap = await getDocs(collection(db, COLLECTION));
      ARTICLES = snap.docs.map(d => {
        const data = d.data();
        return {
          id: d.id,
          title: data.title || "ไม่มีหัวข้อ",
          category: data.category || "ทั่วไป",
          content: data.content || "",
          author: data.author || "ผู้ใช้งาน",
          createdAt: toDateSafe(data.createdAt)
        };
      });
      ARTICLES.sort((a,b) => (b.createdAt?.getTime()||0) - (a.createdAt?.getTime()||0));
    }catch(err){
      console.error("โหลดคลังความรู้ไม่สำเร็จ:", err);
      ARTICLES = [];
    }
    renderChips();
    renderGrid();
  }

  function renderChips(){
    const chips = document.getElementById("kbChips");
    const categories = [...new Set(ARTICLES.map(a => a.category))].sort();

    const datalist = document.getElementById("kbCategoryList");
    datalist.innerHTML = categories.map(c => `<option value="${escapeHtml(c)}">`).join("");

    const all = [{ label:"ทั้งหมด", value:"" }, ...categories.map(c => ({ label:c, value:c }))];
    chips.innerHTML = all.map(c => `
      <button type="button" class="kb-chip ${activeCategory === c.value ? "is-active" : ""}" data-cat="${escapeHtml(c.value)}">${escapeHtml(c.label)}</button>
    `).join("");

    chips.querySelectorAll(".kb-chip").forEach(btn => {
      btn.addEventListener("click", () => {
        activeCategory = btn.dataset.cat;
        renderChips();
        renderGrid();
      });
    });
  }

  function filteredArticles(){
    const q = searchTerm.trim().toLowerCase();
    return ARTICLES.filter(a => {
      if(activeCategory && a.category !== activeCategory) return false;
      if(q && !(a.title.toLowerCase().includes(q) || a.content.toLowerCase().includes(q) || a.category.toLowerCase().includes(q))) return false;
      return true;
    });
  }

  let observer;
  function renderGrid(highlightId){
    const grid = document.getElementById("kbGrid");
    const empty = document.getElementById("kbEmpty");
    const list = filteredArticles();

    if(!ARTICLES.length){
      grid.innerHTML = "";
      empty.hidden = false;
      document.getElementById("kbEmptyText").textContent = "ยังไม่มีบทความในคลังความรู้ — เริ่มเพิ่มบทความแรกของทีมได้เลย";
      return;
    }
    if(!list.length){
      grid.innerHTML = "";
      empty.hidden = false;
      document.getElementById("kbEmptyText").textContent = "ไม่พบบทความที่ตรงกับการค้นหาหรือหมวดหมู่นี้";
      return;
    }
    empty.hidden = true;

    grid.innerHTML = list.map(a => {
      const c = tagColor(a.category);
      return `
        <article class="kb-card" data-id="${escapeHtml(a.id)}">
          <div class="kb-card__top">
            <span class="kb-tag" style="background:${c.bg}; color:${c.fg};">${escapeHtml(a.category)}</span>
            <button class="kb-card__delete" data-delete="${escapeHtml(a.id)}" type="button" aria-label="ลบบทความ" title="ลบบทความ">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
            </button>
          </div>
          <h3>${escapeHtml(a.title)}</h3>
          <p class="kb-card__excerpt">${escapeHtml(a.content)}</p>
          <div class="kb-card__meta">
            <span>${escapeHtml(a.author)}</span>
            <span>${fmtDateThai(a.createdAt)}</span>
          </div>
        </article>
      `;
    }).join("");

    grid.querySelectorAll(".kb-card").forEach(card => {
      card.addEventListener("click", (e) => {
        if(e.target.closest("[data-delete]")) return;
        openViewModal(card.dataset.id);
      });
    });
    grid.querySelectorAll("[data-delete]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        confirmDelete(btn.dataset.delete);
      });
    });

    // Scroll-reveal: cards fade + rise into place as they enter the
    // viewport, rather than all animating on load.
    if(observer) observer.disconnect();
    observer = new IntersectionObserver((entries) => {
      entries.forEach((entry, i) => {
        if(entry.isIntersecting){
          entry.target.style.transitionDelay = `${(i % 6) * 45}ms`;
          entry.target.classList.add("is-visible");
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
    grid.querySelectorAll(".kb-card").forEach(card => observer.observe(card));

    if(highlightId){
      const el = grid.querySelector(`.kb-card[data-id="${highlightId}"]`);
      if(el){
        el.classList.add("is-visible", "just-added");
        el.scrollIntoView({ behavior:"smooth", block:"center" });
      }
    }
  }

  function openViewModal(id){
    const a = ARTICLES.find(x => x.id === id);
    if(!a) return;
    const c = tagColor(a.category);
    const tagEl = document.getElementById("viewTag");
    tagEl.textContent = a.category;
    tagEl.style.background = c.bg;
    tagEl.style.color = c.fg;
    document.getElementById("viewTitle").textContent = a.title;
    document.getElementById("viewMeta").textContent = `${a.author} · ${fmtDateThai(a.createdAt)}`;
    document.getElementById("viewBody").textContent = a.content;
    document.getElementById("kbViewModal").classList.add("is-open");
  }

  async function confirmDelete(id){
    if(!confirm("ต้องการลบบทความนี้ใช่หรือไม่?")) return;
    try{
      await deleteDoc(doc(db, COLLECTION, id));
      ARTICLES = ARTICLES.filter(a => a.id !== id);
      renderChips();
      renderGrid();
    }catch(err){
      console.error("ลบบทความไม่สำเร็จ:", err);
      alert("ลบบทความไม่สำเร็จ กรุณาลองใหม่อีกครั้ง");
    }
  }

  // ---- add modal ----
  const addModal = document.getElementById("kbAddModal");
  function openAddModal(){
    document.getElementById("fTitle").value = "";
    document.getElementById("fCategory").value = "";
    document.getElementById("fContent").value = "";
    ["fieldTitle","fieldCategory","fieldContent"].forEach(id => document.getElementById(id).classList.remove("has-error"));
    addModal.classList.add("is-open");
    setTimeout(() => document.getElementById("fTitle").focus(), 50);
  }
  document.getElementById("btnAdd").addEventListener("click", openAddModal);
  document.getElementById("btnAddEmpty").addEventListener("click", openAddModal);

  document.getElementById("fSave").addEventListener("click", async () => {
    const titleEl = document.getElementById("fTitle");
    const catEl = document.getElementById("fCategory");
    const contentEl = document.getElementById("fContent");

    const title = titleEl.value.trim();
    const category = catEl.value.trim();
    const content = contentEl.value.trim();

    document.getElementById("fieldTitle").classList.toggle("has-error", !title);
    document.getElementById("fieldCategory").classList.toggle("has-error", !category);
    document.getElementById("fieldContent").classList.toggle("has-error", !content);
    if(!title || !category || !content) return;

    const saveBtn = document.getElementById("fSave");
    saveBtn.disabled = true;
    saveBtn.textContent = "กำลังบันทึก…";

    try{
      const ref = await addDoc(collection(db, COLLECTION), {
        title, category, content,
        author: currentUserLabel,
        createdAt: serverTimestamp()
      });
      addModal.classList.remove("is-open");
      ARTICLES.unshift({ id: ref.id, title, category, content, author: currentUserLabel, createdAt: new Date() });
      activeCategory = "";
      searchTerm = "";
      document.getElementById("kbSearch").value = "";
      renderChips();
      renderGrid(ref.id);
    }catch(err){
      console.error("บันทึกบทความไม่สำเร็จ:", err);
      alert("บันทึกบทความไม่สำเร็จ กรุณาลองใหม่อีกครั้ง");
    }finally{
      saveBtn.disabled = false;
      saveBtn.textContent = "บันทึกบทความ";
    }
  });

  // ---- shared modal close handling ----
  document.querySelectorAll(".kb-modal").forEach(modal => {
    modal.querySelectorAll("[data-close]").forEach(el =>
      el.addEventListener("click", () => modal.classList.remove("is-open"))
    );
  });
  document.addEventListener("keydown", (e) => {
    if(e.key === "Escape") document.querySelectorAll(".kb-modal.is-open").forEach(m => m.classList.remove("is-open"));
  });

  // ---- search ----
  document.getElementById("kbSearch").addEventListener("input", (e) => {
    searchTerm = e.target.value;
    renderGrid();
  });

  loadArticles();
</script>

</body>
</html>
